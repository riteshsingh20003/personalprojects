<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Recreation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
          <div class="hero-image">
            <img src="placeholder.jpg" alt="Hero Image">
          </div>
          <div class="hero-text">
            <h1>Main Title</h1>
            <p>Some descriptive text.</p>
          </div>
        </section>

        <section class="section-with-boxes">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
        </section>

        <section class="section-with-image-and-text">
            <img src="placeholder.jpg" alt="Section Image">
            <div class="text-content">
                <h2>Section Title</h2>
                <p>More text content.</p>
            </div>
        </section>

        <section class="gallery">
            <div class="gallery-item">
                <img src="placeholder.jpg" alt="Gallery Image 1">
            </div>
            <div class="gallery-item">
                <img src="placeholder.jpg" alt="Gallery Image 2">
            </div>
        </section>

        </main>

    <footer>
        <p>&copy; 2023 My Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
